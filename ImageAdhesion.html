<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高画質 縦連結画像ジェネレーター</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'system-ui',
              '-apple-system',
              'BlinkMacSystemFont',
              '"Segoe UI"',
              'Roboto',
              '"Helvetica Neue"',
              'Arial',
              'sans-serif'
            ],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* チェック柄背景 (透明画像の表現用) */
    .bg-checker {
      background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-full flex flex-col antialiased">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight text-slate-900">高画質 縦連結画像ジェネレーター</h1>
          <p class="text-xs text-slate-500">外部フォント・ライブラリ非依存の軽量仕様</p>
        </div>
      </div>
      <button id="clearAllBtn" class="hidden px-3 py-1.5 text-xs font-medium text-rose-600 hover:bg-rose-50 rounded-lg transition-colors flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        全削除
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左カラム: 操作・設定パネル (5 cols) -->
    <section class="lg:col-span-5 flex flex-col gap-5">

      <!-- ドロップゾーン -->
      <div id="dropZone" class="border-2 border-dashed border-brand-500/40 hover:border-brand-600 bg-white rounded-2xl p-6 text-center cursor-pointer transition-all duration-200 shadow-sm hover:shadow flex flex-col items-center justify-center group">
        <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
        <div class="w-12 h-12 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <p class="text-sm font-semibold text-slate-800 mb-1">画像をドラッグ＆ドロップ</p>
        <p class="text-xs text-slate-400 mb-3">またはクリックしてファイルを選択（複数可能）</p>
        <span class="px-4 py-1.5 bg-brand-600 text-white text-xs font-medium rounded-full shadow-sm group-hover:bg-brand-700 transition-all">
          ファイルを選択
        </span>
      </div>

      <!-- 画像リスト (順序変更・削除) -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-1.5">
            <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
            </svg>
            追加済み画像 (<span id="imageCount">0</span>)
          </h2>
          <span class="text-[11px] text-slate-400">ドラッグまたは矢印で並び替え</span>
        </div>

        <div id="imageList" class="max-h-48 overflow-y-auto space-y-2 pr-1">
          <div id="emptyListMsg" class="h-20 flex flex-col items-center justify-center text-slate-400 text-xs italic border border-dashed border-slate-200 rounded-xl">
            画像が追加されていません
          </div>
        </div>
      </div>

      <!-- 設定パネル -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 space-y-4">
        <h2 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-1.5 border-b pb-2">
          <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
          レイアウト設定
        </h2>

        <!-- 水平揃え -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">水平方向の配置</label>
          <div class="grid grid-cols-3 gap-2">
            <button data-align="center" class="align-btn active py-1.5 px-2 border border-brand-600 bg-brand-50 text-brand-600 rounded-lg text-xs font-medium flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M7 12h10M9 18h6"/>
              </svg>
              中央揃え
            </button>
            <button data-align="left" class="align-btn py-1.5 px-2 border border-slate-200 text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-50 flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h6"/>
              </svg>
              左揃え
            </button>
            <button data-align="right" class="align-btn py-1.5 px-2 border border-slate-200 text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-50 flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M10 12h10M14 18h6"/>
              </svg>
              右揃え
            </button>
          </div>
        </div>

        <!-- 幅の決定基準 -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">幅の決定基準</label>
          <select id="widthMode" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-brand-500 outline-none">
            <option value="max">一番広い画像に合わせる (縮小なし・余白補正)</option>
            <option value="custom">固定キャンバス幅を指定</option>
          </select>
          <div id="customWidthContainer" class="hidden mt-2 flex items-center gap-2">
            <span class="text-xs text-slate-500">幅 (px):</span>
            <input type="number" id="customWidthInput" value="1920" min="100" max="10000" class="w-full text-xs border border-slate-200 rounded-lg p-1.5 text-slate-800 focus:ring-2 focus:ring-brand-500 outline-none">
          </div>
        </div>

        <!-- 画像間の隙間 (Gap) -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-slate-700">画像間の隙間 (Gap)</label>
            <span id="spacingValue" class="text-xs font-bold text-brand-600">0 px</span>
          </div>
          <div class="flex items-center gap-3">
            <input type="range" id="spacingInput" min="0" max="200" value="0" class="w-full accent-brand-600 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
            <input type="number" id="spacingNumInput" min="0" max="500" value="0" class="w-16 text-xs text-center border border-slate-200 rounded-lg p-1">
          </div>
        </div>

        <!-- パディング（外側余白） -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">外側の余白（パディング px）</label>
          <div class="grid grid-cols-4 gap-2">
            <div>
              <span class="block text-[10px] text-slate-400 mb-0.5">上</span>
              <input type="number" id="padTop" value="0" min="0" class="pad-input w-full text-xs text-center border border-slate-200 rounded-lg p-1">
            </div>
            <div>
              <span class="block text-[10px] text-slate-400 mb-0.5">下</span>
              <input type="number" id="padBottom" value="0" min="0" class="pad-input w-full text-xs text-center border border-slate-200 rounded-lg p-1">
            </div>
            <div>
              <span class="block text-[10px] text-slate-400 mb-0.5">左</span>
              <input type="number" id="padLeft" value="0" min="0" class="pad-input w-full text-xs text-center border border-slate-200 rounded-lg p-1">
            </div>
            <div>
              <span class="block text-[10px] text-slate-400 mb-0.5">右</span>
              <input type="number" id="padRight" value="0" min="0" class="pad-input w-full text-xs text-center border border-slate-200 rounded-lg p-1">
            </div>
          </div>
        </div>

        <!-- 背景色 -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">背景色</label>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="bgColor" value="transparent" checked class="accent-brand-600">
              <span>透明</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="bgColor" value="#ffffff" class="accent-brand-600">
              <span>白</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="bgColor" value="#000000" class="accent-brand-600">
              <span>黒</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-xs">
              <input type="radio" name="bgColor" value="custom" class="accent-brand-600">
              <span>指定</span>
            </label>
            <input type="color" id="customColorPicker" value="#f1f5f9" class="w-6 h-6 rounded border-0 p-0 cursor-pointer disabled:opacity-30" disabled>
          </div>
        </div>
      </div>

      <!-- ダウンロード設定 -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 space-y-3">
        <h2 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-1.5">
          <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          出力設定
        </h2>

        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">出力ファイル名</label>
          <input type="text" id="fileNameInput" value="combined_image" class="w-full text-xs border border-slate-200 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-brand-500 outline-none">
        </div>

        <div class="grid grid-cols-3 gap-2 pt-1">
          <label class="flex flex-col items-center p-2 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 text-xs">
            <input type="radio" name="format" value="image/png" checked class="accent-brand-600 mb-1">
            <span class="font-bold text-slate-700">PNG</span>
            <span class="text-[10px] text-slate-400">高画質/透明可</span>
          </label>
          <label class="flex flex-col items-center p-2 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 text-xs">
            <input type="radio" name="format" value="image/jpeg" class="accent-brand-600 mb-1">
            <span class="font-bold text-slate-700">JPEG</span>
            <span class="text-[10px] text-slate-400">品質 1.0</span>
          </label>
          <label class="flex flex-col items-center p-2 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 text-xs">
            <input type="radio" name="format" value="image/webp" class="accent-brand-600 mb-1">
            <span class="font-bold text-slate-700">WebP</span>
            <span class="text-[10px] text-slate-400">品質 1.0</span>
          </label>
        </div>

        <button id="downloadBtn" class="w-full py-3 px-4 bg-brand-600 text-white font-bold text-xs sm:text-sm rounded-xl shadow hover:bg-brand-700 active:scale-[0.99] transition-all flex items-center justify-center gap-2 disabled:bg-slate-300 disabled:cursor-not-allowed" disabled>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          結合画像を保存
        </button>
      </div>

    </section>

    <!-- 右カラム: プレビュー画面 (7 cols) -->
    <section class="lg:col-span-7 flex flex-col">
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 flex-1 flex flex-col min-h-[500px]">
        
        <!-- プレビューヘッダー -->
        <div class="flex flex-wrap justify-between items-center gap-2 mb-3 pb-3 border-b border-slate-100">
          <div>
            <h2 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-1.5">
              <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              プレビュー
            </h2>
            <p id="canvasMetrics" class="text-[11px] text-slate-400">解像度: - x - px</p>
          </div>

          <!-- ズームコントロール -->
          <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
            <button id="zoomOutBtn" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:bg-white rounded transition-colors" title="縮小">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
            </button>
            <span id="zoomLabel" class="text-xs font-semibold w-12 text-center text-slate-700">100%</span>
            <button id="zoomInBtn" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:bg-white rounded transition-colors" title="拡大">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
            <button id="zoomResetBtn" class="px-2 h-6 flex items-center justify-center text-[11px] font-medium text-slate-600 hover:bg-white rounded transition-colors">
              全体表示
            </button>
          </div>
        </div>

        <!-- Canvas表示エリア -->
        <div id="previewContainer" class="flex-1 relative overflow-auto bg-checker rounded-xl border border-slate-200 flex items-center justify-center min-h-[400px]">
          <!-- ローディング指示 -->
          <div id="loadingSpinner" class="hidden absolute inset-0 bg-white/70 backdrop-blur-sm z-20 flex-col items-center justify-center gap-2">
            <div class="w-7 h-7 border-3 border-brand-600 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-xs font-bold text-brand-600">高画質処理中...</span>
          </div>

          <!-- プレビューCanvas -->
          <canvas id="previewCanvas" class="shadow-md max-w-none transition-transform duration-75"></canvas>
          
          <!-- 画像未選択時 -->
          <div id="noImagePreview" class="text-center p-8 text-slate-400 flex flex-col items-center">
            <svg class="w-12 h-12 mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p class="text-xs sm:text-sm font-medium">画像を追加するとリアルタイムプレビューが表示されます</p>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
    <svg class="w-4 h-4 text-brand-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span id="toastMsg">メッセージ</span>
  </div>

  <script>
    // 状態管理
    const state = {
      images: [],
      align: 'center',
      widthMode: 'max',
      customWidth: 1920,
      spacing: 0,
      padding: { top: 0, bottom: 0, left: 0, right: 0 },
      bgColor: 'transparent',
      customColor: '#f1f5f9',
      zoom: 1,
      draggedIndex: null
    };

    // DOM要素取得
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const imageList = document.getElementById('imageList');
    const emptyListMsg = document.getElementById('emptyListMsg');
    const imageCount = document.getElementById('imageCount');
    const clearAllBtn = document.getElementById('clearAllBtn');

    const widthModeSelect = document.getElementById('widthMode');
    const customWidthContainer = document.getElementById('customWidthContainer');
    const customWidthInput = document.getElementById('customWidthInput');

    const spacingInput = document.getElementById('spacingInput');
    const spacingNumInput = document.getElementById('spacingNumInput');
    const spacingValue = document.getElementById('spacingValue');

    const customColorPicker = document.getElementById('customColorPicker');
    const downloadBtn = document.getElementById('downloadBtn');
    const fileNameInput = document.getElementById('fileNameInput');

    const previewCanvas = document.getElementById('previewCanvas');
    const previewContainer = document.getElementById('previewContainer');
    const noImagePreview = document.getElementById('noImagePreview');
    const canvasMetrics = document.getElementById('canvasMetrics');
    const loadingSpinner = document.getElementById('loadingSpinner');

    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomLabel = document.getElementById('zoomLabel');

    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
    });

    function setupEventListeners() {
      // ファイル選択
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFileSelect);

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-brand-600', 'bg-brand-50');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-brand-600', 'bg-brand-50');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-brand-600', 'bg-brand-50');
        if (e.dataTransfer.files.length > 0) {
          handleFiles(e.dataTransfer.files);
        }
      });

      clearAllBtn.addEventListener('click', () => {
        state.images = [];
        updateUI();
        renderCanvas();
        showToast('画像をすべて削除しました');
      });

      // 水平揃えボタン
      document.querySelectorAll('.align-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.align-btn').forEach(b => {
            b.classList.remove('active', 'border-brand-600', 'bg-brand-50', 'text-brand-600');
            b.classList.add('border-slate-200', 'text-slate-600');
          });
          const target = e.currentTarget;
          target.classList.add('active', 'border-brand-600', 'bg-brand-50', 'text-brand-600');
          target.classList.remove('border-slate-200', 'text-slate-600');
          
          state.align = target.dataset.align;
          renderCanvas();
        });
      });

      // 幅モード
      widthModeSelect.addEventListener('change', (e) => {
        state.widthMode = e.target.value;
        if (state.widthMode === 'custom') {
          customWidthContainer.classList.remove('hidden');
        } else {
          customWidthContainer.classList.add('hidden');
        }
        renderCanvas();
      });

      customWidthInput.addEventListener('input', (e) => {
        state.customWidth = parseInt(e.target.value) || 100;
        renderCanvas();
      });

      // 間隔 (Gap)
      const updateSpacing = (val) => {
        val = Math.max(0, Math.min(500, parseInt(val) || 0));
        state.spacing = val;
        spacingInput.value = Math.min(200, val);
        spacingNumInput.value = val;
        spacingValue.textContent = `${val} px`;
        renderCanvas();
      };

      spacingInput.addEventListener('input', (e) => updateSpacing(e.target.value));
      spacingNumInput.addEventListener('input', (e) => updateSpacing(e.target.value));

      // パディング入力
      document.querySelectorAll('.pad-input').forEach(input => {
        input.addEventListener('input', () => {
          state.padding = {
            top: parseInt(document.getElementById('padTop').value) || 0,
            bottom: parseInt(document.getElementById('padBottom').value) || 0,
            left: parseInt(document.getElementById('padLeft').value) || 0,
            right: parseInt(document.getElementById('padRight').value) || 0,
          };
          renderCanvas();
        });
      });

      // 背景色選択
      document.querySelectorAll('input[name="bgColor"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const val = e.target.value;
          if (val === 'custom') {
            customColorPicker.disabled = false;
            state.bgColor = customColorPicker.value;
          } else {
            customColorPicker.disabled = true;
            state.bgColor = val;
          }
          renderCanvas();
        });
      });

      customColorPicker.addEventListener('input', (e) => {
        state.bgColor = e.target.value;
        renderCanvas();
      });

      // ズーム設定
      zoomInBtn.addEventListener('click', () => setZoom(state.zoom + 0.15));
      zoomOutBtn.addEventListener('click', () => setZoom(state.zoom - 0.15));
      zoomResetBtn.addEventListener('click', fitZoomToContainer);

      // 保存
      downloadBtn.addEventListener('click', downloadCombinedImage);
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) {
        handleFiles(e.target.files);
        fileInput.value = '';
      }
    }

    function handleFiles(files) {
      const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (validFiles.length === 0) {
        showToast('画像ファイルを選択してください');
        return;
      }

      showLoading(true);
      let loadedCount = 0;

      validFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            state.images.push({
              id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
              file: file,
              name: file.name,
              src: e.target.result,
              width: img.naturalWidth,
              height: img.naturalHeight,
              element: img
            });

            loadedCount++;
            if (loadedCount === validFiles.length) {
              showLoading(false);
              updateUI();
              fitZoomToContainer();
              renderCanvas();
              showToast(`${validFiles.length}枚の画像を追加しました`);
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function updateUI() {
      imageCount.textContent = state.images.length;

      if (state.images.length > 0) {
        emptyListMsg.classList.add('hidden');
        clearAllBtn.classList.remove('hidden');
        downloadBtn.disabled = false;
      } else {
        emptyListMsg.classList.remove('hidden');
        clearAllBtn.classList.add('hidden');
        downloadBtn.disabled = true;
      }

      imageList.querySelectorAll('.image-item').forEach(el => el.remove());

      state.images.forEach((imgObj, index) => {
        const item = document.createElement('div');
        item.className = 'image-item flex items-center justify-between p-2 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200/80 transition-all cursor-grab active:cursor-grabbing text-xs';
        item.draggable = true;
        item.dataset.index = index;

        item.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden">
            <span class="font-bold text-slate-400 w-4 text-center text-[11px]">${index + 1}</span>
            <img src="${imgObj.src}" class="w-8 h-8 object-cover rounded-md border border-slate-200 flex-shrink-0">
            <div class="truncate">
              <p class="font-medium text-slate-800 truncate text-[11px]">${imgObj.name}</p>
              <p class="text-[10px] text-slate-400">${imgObj.width} × ${imgObj.height} px</p>
            </div>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <button class="btn-move-up w-5 h-5 rounded hover:bg-slate-200 text-slate-500 flex items-center justify-center ${index === 0 ? 'opacity-20 cursor-not-allowed' : ''}">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
            </button>
            <button class="btn-move-down w-5 h-5 rounded hover:bg-slate-200 text-slate-500 flex items-center justify-center ${index === state.images.length - 1 ? 'opacity-20 cursor-not-allowed' : ''}">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <button class="btn-delete w-5 h-5 rounded hover:bg-rose-100 text-rose-500 flex items-center justify-center ml-0.5">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        `;

        item.addEventListener('dragstart', (e) => {
          state.draggedIndex = index;
          e.dataTransfer.effectAllowed = 'move';
          item.classList.add('opacity-40');
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('opacity-40');
          state.draggedIndex = null;
        });

        item.addEventListener('dragover', (e) => e.preventDefault());

        item.addEventListener('drop', (e) => {
          e.preventDefault();
          if (state.draggedIndex !== null && state.draggedIndex !== index) {
            const movedItem = state.images.splice(state.draggedIndex, 1)[0];
            state.images.splice(index, 0, movedItem);
            updateUI();
            renderCanvas();
          }
        });

        item.querySelector('.btn-move-up').addEventListener('click', (e) => {
          e.stopPropagation();
          if (index > 0) {
            const temp = state.images[index];
            state.images[index] = state.images[index - 1];
            state.images[index - 1] = temp;
            updateUI();
            renderCanvas();
          }
        });

        item.querySelector('.btn-move-down').addEventListener('click', (e) => {
          e.stopPropagation();
          if (index < state.images.length - 1) {
            const temp = state.images[index];
            state.images[index] = state.images[index + 1];
            state.images[index + 1] = temp;
            updateUI();
            renderCanvas();
          }
        });

        item.querySelector('.btn-delete').addEventListener('click', (e) => {
          e.stopPropagation();
          state.images.splice(index, 1);
          updateUI();
          renderCanvas();
        });

        imageList.appendChild(item);
      });
    }

    // キャンバスレンダリング (100%解像度維持)
    function renderCanvas() {
      if (state.images.length === 0) {
        previewCanvas.style.display = 'none';
        noImagePreview.style.display = 'flex';
        canvasMetrics.textContent = '解像度: - x - px';
        return;
      }

      previewCanvas.style.display = 'block';
      noImagePreview.style.display = 'none';

      // 内側の最大画像幅を取得
      const maxImgWidth = Math.max(...state.images.map(img => img.width));
      
      // キャンバス全体幅の計算
      let innerWidth = 0;
      if (state.widthMode === 'max') {
        innerWidth = maxImgWidth;
      } else {
        innerWidth = state.customWidth;
      }

      const totalCanvasWidth = innerWidth + state.padding.left + state.padding.right;

      // キャンバス全体高さの計算
      let innerHeight = 0;
      state.images.forEach((img, idx) => {
        innerHeight += img.height;
        if (idx < state.images.length - 1) {
          innerHeight += state.spacing;
        }
      });

      const totalCanvasHeight = innerHeight + state.padding.top + state.padding.bottom;

      // キャンバスサイズ設定 (原寸ピクセル)
      previewCanvas.width = totalCanvasWidth;
      previewCanvas.height = totalCanvasHeight;

      const ctx = previewCanvas.getContext('2d');
      ctx.clearRect(0, 0, totalCanvasWidth, totalCanvasHeight);

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 背景の描画
      if (state.bgColor !== 'transparent') {
        ctx.fillStyle = state.bgColor;
        ctx.fillRect(0, 0, totalCanvasWidth, totalCanvasHeight);
      }

      // 画像描画位置計算
      let currentY = state.padding.top;
      state.images.forEach((img) => {
        let x = state.padding.left;

        if (state.align === 'center') {
          x = state.padding.left + (innerWidth - img.width) / 2;
        } else if (state.align === 'right') {
          x = state.padding.left + (innerWidth - img.width);
        } else {
          x = state.padding.left; // left
        }

        ctx.drawImage(img.element, x, currentY, img.width, img.height);
        currentY += img.height + state.spacing;
      });

      canvasMetrics.textContent = `解像度: ${totalCanvasWidth.toLocaleString()} × ${totalCanvasHeight.toLocaleString()} px`;

      applyZoom();
    }

    function setZoom(zoomValue) {
      state.zoom = Math.max(0.1, Math.min(3.0, zoomValue));
      zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
      applyZoom();
    }

    function applyZoom() {
      previewCanvas.style.transform = `scale(${state.zoom})`;
      previewCanvas.style.transformOrigin = 'center center';
    }

    function fitZoomToContainer() {
      if (state.images.length === 0) return;

      const containerWidth = previewContainer.clientWidth - 40;
      const containerHeight = previewContainer.clientHeight - 40;

      const canvasWidth = previewCanvas.width;
      const canvasHeight = previewCanvas.height;

      if (canvasWidth === 0 || canvasHeight === 0) return;

      const scaleX = containerWidth / canvasWidth;
      const scaleY = containerHeight / canvasHeight;

      const fitScale = Math.min(scaleX, scaleY, 1.0);
      setZoom(fitScale);
    }

    // 高画質画像保存
    function downloadCombinedImage() {
      if (state.images.length === 0) return;

      showLoading(true);

      setTimeout(() => {
        const formatRadio = document.querySelector('input[name="format"]:checked');
        const mimeType = formatRadio ? formatRadio.value : 'image/png';
        
        let ext = 'png';
        if (mimeType === 'image/jpeg') ext = 'jpg';
        if (mimeType === 'image/webp') ext = 'webp';

        const rawFileName = fileNameInput.value.trim() || 'combined_image';
        const fileName = `${rawFileName}.${ext}`;

        const dataUrl = previewCanvas.toDataURL(mimeType, 1.0);

        const link = document.createElement('a');
        link.download = fileName;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showLoading(false);
        showToast('高画質結合画像を保存しました');
      }, 100);
    }

    function showLoading(show) {
      if (show) {
        loadingSpinner.classList.remove('hidden');
        loadingSpinner.classList.add('flex');
      } else {
        loadingSpinner.classList.add('hidden');
        loadingSpinner.classList.remove('flex');
      }
    }

    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
</body>

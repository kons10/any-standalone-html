<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最強AI 2048 自動プレイ (安定強化版)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #faf8ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #bbada0;
            padding: 30px 30px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            margin: 0 0 10px;
            color: #776e65;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .score-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #cdc1b4;
            padding: 8px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #776e65;
            font-weight: bold;
        }
        .score-label {
            font-size: 16px;
        }
        #score {
            font-size: 28px;
            color: #3c3a32;
            min-width: 80px;
            text-align: right;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            background: #bbada0;
            margin-bottom: 20px;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: #cdc1b4;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            transition: background 0.08s, transform 0.1s;
            color: #776e65;
        }
        .cell[data-value="0"] {
            background: #cdc1b4;
            color: transparent;
        }
        .cell[data-value="2"] { background: #eee4da; color: #776e65; }
        .cell[data-value="4"] { background: #ede0c8; color: #776e65; }
        .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
        .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
        .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
        .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
        .cell[data-value="128"] { background: #edcf72; color: #f9f6f2; }
        .cell[data-value="256"] { background: #edcc61; color: #f9f6f2; }
        .cell[data-value="512"] { background: #edc850; color: #f9f6f2; }
        .cell[data-value="1024"] { background: #edc53f; color: #f9f6f2; }
        .cell[data-value="2048"] { background: #edc22e; color: #f9f6f2; }
        .cell[data-value="4096"] { background: #60d992; color: #f9f6f2; }
        .cell[data-value="8192"] { background: #3c9a6e; color: #f9f6f2; }
        .cell[data-value="16384"] { background: #3c3a32; color: #f9f6f2; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
        }
        .controls button {
            background: #8f7a66;
            border: none;
            border-radius: 8px;
            color: #f9f6f2;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 24px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 0 #5f4a3a;
            flex: 1 1 auto;
            min-width: 100px;
            letter-spacing: 1px;
        }
        .controls button:hover {
            background: #9f8b76;
            transform: translateY(-2px);
        }
        .controls button:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .controls button:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: none;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            color: #776e65;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
        }
        @media (max-width: 480px) {
            .cell {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            .grid { gap: 8px; }
            .container { padding: 20px; }
            .controls button { font-size: 14px; padding: 10px 12px; min-width: 70px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 2048 AI (安定強化版)</h1>
        <div class="score-wrap">
            <span class="score-label">スコア</span>
            <span id="score">0</span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="controls">
            <button id="autoBtn">▶ 自動開始</button>
            <button id="stepBtn">👣 ステップ</button>
            <button id="resetBtn">🔄 リセット</button>
        </div>
        <div class="status" id="status">準備完了</div>
    </div>

    <script>
        // ============================================================
        //  1. コアロジック (2048 のルール)
        // ============================================================
        const SIZE = 4;

        function createEmptyBoard() {
            return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        }

        function cloneBoard(board) {
            return board.map(row => [...row]);
        }

        function getEmptyCells(board) {
            const cells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) cells.push({ r, c });
                }
            }
            return cells;
        }

        function addRandomTile(board) {
            const empty = getEmptyCells(board);
            if (empty.length === 0) return board;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
            return board;
        }

        function moveLeft(board) {
            const newBoard = cloneBoard(board);
            let moved = false;
            let gained = 0;
            for (let r = 0; r < SIZE; r++) {
                let row = newBoard[r].filter(v => v !== 0);
                const merged = [];
                for (let i = 0; i < row.length; i++) {
                    if (i + 1 < row.length && row[i] === row[i + 1]) {
                        const val = row[i] * 2;
                        merged.push(val);
                        gained += val;
                        i++;
                    } else {
                        merged.push(row[i]);
                    }
                }
                while (merged.length < SIZE) merged.push(0);
                if (newBoard[r].join(',') !== merged.join(',')) moved = true;
                newBoard[r] = merged;
            }
            return { board: newBoard, moved, score: gained };
        }

        function moveRight(board) {
            const rev = board.map(row => [...row].reverse());
            const result = moveLeft(rev);
            return { board: result.board.map(row => row.reverse()), moved: result.moved, score: result.score };
        }

        function moveUp(board) {
            const transposed = Array.from({ length: SIZE }, (_, c) => board.map(row => row[c]));
            const result = moveLeft(transposed);
            const newBoard = Array.from({ length: SIZE }, (_, r) => result.board.map(row => row[r]));
            return { board: newBoard, moved: result.moved, score: result.score };
        }

        function moveDown(board) {
            const transposed = Array.from({ length: SIZE }, (_, c) => board.map(row => row[c]));
            const rev = transposed.map(row => [...row].reverse());
            const result = moveLeft(rev);
            const unRev = result.board.map(row => row.reverse());
            const newBoard = Array.from({ length: SIZE }, (_, r) => unRev.map(row => row[r]));
            return { board: newBoard, moved: result.moved, score: result.score };
        }

        function executeMove(board, dir) {
            switch (dir) {
                case 0: return moveLeft(board);
                case 1: return moveRight(board);
                case 2: return moveUp(board);
                case 3: return moveDown(board);
                default: return { board: cloneBoard(board), moved: false, score: 0 };
            }
        }

        function getPossibleMoves(board) {
            const dirs = [];
            for (let d = 0; d < 4; d++) {
                if (executeMove(board, d).moved) dirs.push(d);
            }
            return dirs;
        }

        function isGameOver(board) {
            if (getEmptyCells(board).length > 0) return false;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = board[r][c];
                    if (c < SIZE - 1 && board[r][c + 1] === val) return false;
                    if (r < SIZE - 1 && board[r + 1][c] === val) return false;
                }
            }
            return true;
        }

        // ============================================================
        //  2. AI 評価関数 + 期待値探索 (Expectimax)  【安定強化版】
        // ============================================================

        // ---------- 評価関数 (微調整) ----------
        function evaluateBoard(board) {
            if (isGameOver(board)) return -100000;

            const empty = getEmptyCells(board);
            const emptyCount = empty.length;
            const maxVal = Math.max(...board.flat());

            let score = 0;

            // ① 空きマス数 (基本)
            score += emptyCount * 600;

            // ② 空きマスの位置ボーナス (コーナー・エッジは貴重だが重みは控えめ)
            for (const cell of empty) {
                const r = cell.r,
                    c = cell.c;
                const isCorner = (r === 0 || r === SIZE - 1) && (c === 0 || c === SIZE - 1);
                const isEdge = (r === 0 || r === SIZE - 1 || c === 0 || c === SIZE - 1);
                if (isCorner) score += 200;
                else if (isEdge) score += 80;
                else score += 20;
            }

            // ③ 滑らかさ (隣接タイルの指数差が小さいほど良い) 重みは元のまま
            let smooth = 0;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE - 1; c++) {
                    if (board[r][c] !== 0 && board[r][c + 1] !== 0) {
                        smooth -= Math.abs(Math.log2(board[r][c]) - Math.log2(board[r][c + 1]));
                    }
                }
            }
            for (let c = 0; c < SIZE; c++) {
                for (let r = 0; r < SIZE - 1; r++) {
                    if (board[r][c] !== 0 && board[r + 1][c] !== 0) {
                        smooth -= Math.abs(Math.log2(board[r][c]) - Math.log2(board[r + 1][c]));
                    }
                }
            }
            score += smooth * 120;

            // ④ 単調性 (行・列が増加/減少のどちらかに統一されているとボーナス)
            let mono = 0;
            for (let r = 0; r < SIZE; r++) {
                let inc = 0,
                    dec = 0;
                for (let c = 0; c < SIZE - 1; c++) {
                    if (board[r][c] !== 0 && board[r][c + 1] !== 0) {
                        if (board[r][c] <= board[r][c + 1]) inc++;
                        if (board[r][c] >= board[r][c + 1]) dec++;
                    }
                }
                if (inc === SIZE - 1 || dec === SIZE - 1) mono += 250;
            }
            for (let c = 0; c < SIZE; c++) {
                let inc = 0,
                    dec = 0;
                for (let r = 0; r < SIZE - 1; r++) {
                    if (board[r][c] !== 0 && board[r + 1][c] !== 0) {
                        if (board[r][c] <= board[r + 1][c]) inc++;
                        if (board[r][c] >= board[r + 1][c]) dec++;
                    }
                }
                if (inc === SIZE - 1 || dec === SIZE - 1) mono += 250;
            }
            score += mono;

            // ⑤ 最大タイルが隅にあるほど高評価 (コーナーボーナス) 元の強化版と同等
            const corners = [
                [0, 0],
                [0, SIZE - 1],
                [SIZE - 1, 0],
                [SIZE - 1, SIZE - 1]
            ];
            let cornerBonus = 0;
            let maxPos = null;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === maxVal) maxPos = { r, c };
                }
            }
            if (maxPos) {
                let minDist = Infinity;
                for (const [cr, cc] of corners) {
                    const dist = Math.abs(maxPos.r - cr) + Math.abs(maxPos.c - cc);
                    if (dist < minDist) minDist = dist;
                }
                cornerBonus = [20000, 5000, 1000, 200][minDist] || 0;
                if (minDist === 0) cornerBonus += 10000;
            }
            score += cornerBonus;

            // ⑥ 最大タイルが左上に特に近い場合の追加ボーナス (人間戦略)
            if (board[0][0] === maxVal) score += 30000;
            else if (board[0][SIZE - 1] === maxVal) score += 20000;
            else if (board[SIZE - 1][0] === maxVal) score += 20000;
            else if (board[SIZE - 1][SIZE - 1] === maxVal) score += 20000;

            // ⑦ 大きなタイル同士の連結性 (隣接ボーナス) を適度に追加
            let clusterBonus = 0;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = board[r][c];
                    if (val >= 128) {
                        const neighbors = [
                            [r - 1, c],
                            [r + 1, c],
                            [r, c - 1],
                            [r, c + 1]
                        ];
                        for (const [nr, nc] of neighbors) {
                            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
                                const nv = board[nr][nc];
                                if (nv >= val / 2 && nv !== val) {
                                    clusterBonus += val * 0.15;
                                }
                            }
                        }
                    }
                }
            }
            score += clusterBonus;

            return score;
        }

        // ---------- キャッシュ ----------
        const evalCache = new Map();

        function getCacheKey(board, depth, isMax) {
            return board.flat().join(',') + '|' + depth + '|' + (isMax ? '1' : '0');
        }

        // ---------- Expectimax (深度4, チャンスノード全探索) ----------
        function expectimax(board, depth, isMax) {
            if (isGameOver(board)) {
                return evaluateBoard(board);
            }

            const key = getCacheKey(board, depth, isMax);
            if (evalCache.has(key)) {
                return evalCache.get(key);
            }

            if (depth === 0) {
                const val = evaluateBoard(board);
                evalCache.set(key, val);
                return val;
            }

            if (isMax) {
                const moves = getPossibleMoves(board);
                if (moves.length === 0) {
                    const val = evaluateBoard(board);
                    evalCache.set(key, val);
                    return val;
                }
                let best = -Infinity;
                for (const d of moves) {
                    const result = executeMove(board, d);
                    if (result.moved) {
                        const val = expectimax(result.board, depth - 1, false);
                        if (val > best) best = val;
                    }
                }
                const finalVal = (best === -Infinity) ? evaluateBoard(board) : best;
                evalCache.set(key, finalVal);
                return finalVal;
            } else {
                // チャンスノード：空きセルすべてを正確に評価 (全探索)
                const empty = getEmptyCells(board);
                if (empty.length === 0) {
                    const val = evaluateBoard(board);
                    evalCache.set(key, val);
                    return val;
                }
                let total = 0;
                for (const cell of empty) {
                    const b2 = cloneBoard(board);
                    b2[cell.r][cell.c] = 2;
                    total += 0.9 * expectimax(b2, depth - 1, true);
                    const b4 = cloneBoard(board);
                    b4[cell.r][cell.c] = 4;
                    total += 0.1 * expectimax(b4, depth - 1, true);
                }
                const avg = total / empty.length;
                evalCache.set(key, avg);
                return avg;
            }
        }

        // ---------- 最善手の選択 (深度4) ----------
        function getBestMove(board) {
            const moves = getPossibleMoves(board);
            if (moves.length === 0) return null;

            let bestDir = moves[0];
            let bestScore = -Infinity;

            for (const d of moves) {
                const result = executeMove(board, d);
                if (!result.moved) continue;
                // 残り深度 3: チャンス → AI → チャンス
                const score = expectimax(result.board, 3, false);
                if (score > bestScore) {
                    bestScore = score;
                    bestDir = d;
                }
            }
            return bestDir;
        }

        // ============================================================
        //  3. UI 制御 (タイマー連鎖)
        // ============================================================
        let board = createEmptyBoard();
        let score = 0;
        let isRunning = false;
        let timerId = null;

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const statusEl = document.getElementById('status');
        const autoBtn = document.getElementById('autoBtn');
        const stepBtn = document.getElementById('stepBtn');
        const resetBtn = document.getElementById('resetBtn');

        function initGrid() {
            gridEl.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.dataset.value = '0';
                    cell.textContent = '';
                    gridEl.appendChild(cell);
                }
            }
        }
        initGrid();

        function render() {
            const cells = gridEl.querySelectorAll('.cell');
            let idx = 0;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = board[r][c];
                    const cell = cells[idx];
                    cell.dataset.value = val;
                    cell.textContent = val === 0 ? '' : val;
                    idx++;
                }
            }
            scoreEl.textContent = score;
        }

        function clearCache() {
            evalCache.clear();
        }

        function resetGame() {
            if (isRunning) {
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }
                isRunning = false;
                autoBtn.textContent = '▶ 自動開始';
            }
            board = createEmptyBoard();
            score = 0;
            addRandomTile(board);
            addRandomTile(board);
            clearCache();
            render();
            statusEl.textContent = '🔄 リセットしました';
            stepBtn.disabled = false;
        }

        function stepAI() {
            if (isGameOver(board)) {
                statusEl.textContent = '💀 ゲームオーバー！ リセットしてください';
                if (isRunning) {
                    if (timerId) {
                        clearTimeout(timerId);
                        timerId = null;
                    }
                    isRunning = false;
                    autoBtn.textContent = '▶ 自動開始';
                }
                stepBtn.disabled = true;
                return false;
            }

            const dir = getBestMove(board);
            if (dir === null) {
                statusEl.textContent = '⚠️ 有効な手がありません';
                return false;
            }

            const result = executeMove(board, dir);
            if (!result.moved) {
                statusEl.textContent = '⚠️ 移動に失敗しました';
                return false;
            }

            board = result.board;
            score += result.score;
            addRandomTile(board);
            clearCache();
            render();
            statusEl.textContent = `🤖 手を実行 (方向: ${['←','→','↑','↓'][dir]})  スコア: ${score}`;
            return true;
        }

        function autoLoop() {
            if (!isRunning) return;

            if (isGameOver(board)) {
                statusEl.textContent = '💀 ゲームオーバー！ 自動停止しました';
                isRunning = false;
                autoBtn.textContent = '▶ 自動開始';
                stepBtn.disabled = false;
                return;
            }

            const ok = stepAI();
            if (!ok) {
                if (isRunning) {
                    isRunning = false;
                    autoBtn.textContent = '▶ 自動開始';
                    stepBtn.disabled = false;
                }
                return;
            }

            timerId = setTimeout(() => {
                autoLoop();
            }, 60); // 60ms に短縮
        }

        function toggleAuto() {
            if (isRunning) {
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }
                isRunning = false;
                autoBtn.textContent = '▶ 自動開始';
                statusEl.textContent = '⏸ 一時停止中';
                stepBtn.disabled = false;
            } else {
                if (isGameOver(board)) {
                    statusEl.textContent = '💀 ゲームが終了しています。リセットしてください';
                    return;
                }
                isRunning = true;
                autoBtn.textContent = '⏹ 停止';
                stepBtn.disabled = true;
                statusEl.textContent = '⏳ AI 思考中...';
                clearCache();
                const ok = stepAI();
                if (!ok) {
                    isRunning = false;
                    autoBtn.textContent = '▶ 自動開始';
                    stepBtn.disabled = false;
                    return;
                }
                timerId = setTimeout(() => {
                    autoLoop();
                }, 60);
            }
        }

        // ============================================================
        //  4. イベントリスナー
        // ============================================================
        autoBtn.addEventListener('click', toggleAuto);
        stepBtn.addEventListener('click', () => {
            if (isRunning) return;
            clearCache();
            stepAI();
        });
        resetBtn.addEventListener('click', resetGame);

        resetGame();

        document.addEventListener('keydown', (e) => {
            if (isRunning) return;
            const map = {
                'ArrowLeft': 0,
                'ArrowRight': 1,
                'ArrowUp': 2,
                'ArrowDown': 3
            };
            if (e.key in map) {
                e.preventDefault();
                const dir = map[e.key];
                const result = executeMove(board, dir);
                if (result.moved) {
                    board = result.board;
                    score += result.score;
                    addRandomTile(board);
                    clearCache();
                    render();
                    statusEl.textContent = `👆 手動: ${['←','→','↑','↓'][dir]}`;
                    if (isGameOver(board)) {
                        statusEl.textContent = '💀 ゲームオーバー！';
                    }
                }
            }
        });

        console.log('✅ 2048 AI 安定強化版が起動しました！');
        console.log('🔧 改善: 深度4・全探索・評価関数微調整・キャッシュ有効');
        console.log('🔑 矢印キーで手動操作も可能 (自動停止中)');
    </script>
</body>
</html>
